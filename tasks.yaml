  # ───────────────────────────── Milestone 5: checks, rebase queue, attribution guard ─────────────────────────────

  - id: m5-checks
    milestone: 5
    title: "core: checks pipeline, fixers, reviewer findings and blocking"
    deps: [m4-verify]
    touches: [packages/core/src/checks/, packages/core/src/sessions/, prompts/fixer.md, prompts/reviewer.md]
    goal: |
      Implement PLAN.md 9.2, 7.2, the fixer, reviewer and judge roles of 8.1, and decision 21.
      - The pipeline runs when a session ends:
        1. build
        2. acceptance
        3. rebase onto upstream main inside the clone. On a conflict, abort and start a fixer with the conflict
           output; the fixer redoes the rebase. This isn't an attempt unless the fixer gives up.
        4. the full suite on the rebased branch
        5. the reviewer, if reviewer.enabled. At most one reviewer runs at a time.
      - Each check is a `checks` row with a log file in `.mastermind/logs/`, a status and a duration, and emits
        `check.updated`. Check processes run in their own process groups and are registered for the kill path.
        Only one check pipeline runs at a time.
      - Failure handling: if check 1, 2 or 4 fails, or the reviewer reports a serious finding, and attempts remain,
        start a fixer (prompts/fixer.md) with the tail of the failing log or the findings. Each fixer round counts
        an attempt and is followed by the pipeline again. At maxAttempts the task becomes `blocked`, with an event
        line.
      - Reviewer:
        - prompts/reviewer.md, tools limited to Read, Grep and Glob
        - `--json-schema` for [{file, line, text, severity}]
        - sonnet by default
        - findings stored in `findings`
      - A judge helper (haiku, `--max-turns 1 --json-schema`) decides whether a failure is flaky. A flaky failure
        gets one automatic re-run that doesn't count as an attempt.
      - When everything passes, the task goes to `rebasing`, or to `review` if its touches hit requireReviewFor.
      - Routes and tools: GET checks, GET a check log, POST checks/rerun, and the MCP tool get_check_log.
    tests: |
      Integration with fake-claude and a temp repo whose Makefile build and test can be told to fail:
      - A failing build gets a fixer, then passes.
      - A persistent failure blocks after maxAttempts.
      - A rebase conflict is resolved by a fixer.
      - A serious finding gets a fixer; a minor finding is stored and the task proceeds.
      - A protected path goes to review.
    acceptance: "pnpm exec vitest run --project integration checks"

  - id: m5-rebase-queue
    milestone: 5
    title: "core: rebase queue, squash, attribution guard and fast-forward"
    deps: [m5-checks]
    touches: [packages/core/src/rebase/, packages/core/src/attribution.ts]
    goal: |
      Implement PLAN.md 9.3, "Staying current" in 9.2, section 11, and decisions 2, 6, 7, 13, 18 and 19.
      - The rebase queue handles one task at a time:
        1. Rebase onto current main. Conflicts go to a fixer, as in the checks pipeline.
        2. Squash with `reset --soft <main>` and a commit whose message mastermind writes: the subject from the title,
           and a body with the worker's summary from .mastermind-result.md and the task id. No trailers, and the
           owner's identity.
        3. Run the attribution guard.
        4. Build and test.
        5. Fetch into the repo as `refs/mastermind/<id>`.
        6. `git update-ref refs/heads/<main> <new> <old>`. If main moved, retry safely.
        7. Delete the clone and the ref.
        8. Mark the task `done`, wake the scheduler, post the event line, and record `rebases` rows and
           `rebase.updated`.
      - attribution.ts:
        - A scanner and rewriter for the patterns of section 11, case-insensitive and including variants such as
          `Co-authored-by: Claude <noreply@anthropic.com>` and "🤖 Generated with [Claude Code](…)".
        - A final `git log <main>..<branch> --format=%B` scan that stops the rebase onto main if anything matches.
      - If the owner's checkout is on main, rebasing onto main pauses. Emit the event, show the terminal and chat
        prompt, and resume once HEAD moves off main.
      - Staying current: when main moves, rebase every finished branch that isn't on main yet, and re-run checks 4
        and 5.
      - With `autoRebase: false`, passing tasks wait in review.
      - Actions:
        - approve rebases a task that is in review
        - discard deletes the branch and the clone and returns the task to pending (7.2)
        - register approve_rebase and discard_task as gated MCP tools
      - Never `git merge`, and never push or fetch remotes.
    tests: |
      - Unit: a scanner and rewriter table.
      - Integration:
        - A passing task fast-forwards main by exactly one commit, and `git rev-list --merges` stays empty.
        - An injected trailer is stripped and never reaches main.
        - If main moves while a task is being rebased onto it, the update-ref fails safely and the rebase is retried.
        - When the owner is on main, rebasing pauses.
        - discard removes the clone and the ref.
    acceptance: "pnpm exec vitest run --project unit attribution && pnpm exec vitest run --project integration rebase-queue"

  - id: m5-test-and-decide
    milestone: 5
    title: "web: Test and decide screen"
    deps: [m5-rebase-queue]
    touches: [packages/web/src/screens/, test/e2e/web/]
    goal: |
      Implement item 7 of PLAN.md 15.2, without comments (they come in milestone 6).
      - Header: "Ready for review · round N", Discard branch, and the primary "Approve and rebase".
      - Left: the check list with statuses and "Re-run all", and the file list.
      - Centre: the diff.
      - Right: a "Failed test" box with the tail of the failed check's log, and room for the milestone 6 terminal.
      - A click in the UI is the confirmation, so these buttons call the actions directly.
      - The word is "Rebase" everywhere (decision 19); never "Merge" or "Land".
    tests: |
      - Web project: no UI string contains "Merge" or "Land".
      - Playwright, test/e2e/web/decide.spec.ts:
        - A task under requireReviewFor reaches review.
        - Approve and rebase puts it on main.
        - Discard removes another task.
    acceptance: "pnpm exec playwright test decide"

  - id: m5-verify
    milestone: 5
    title: "test: milestone 5 verification"
    deps: [m5-test-and-decide]
    touches: [test/e2e/]
    goal: |
      Prove the milestone 5 "Done when" against the built binary. Fix any defect found.
      - A passing task is rebased onto main and fast-forwarded, with no merge commit.
      - A conflicting branch is resolved by a fixer, then rebased onto main.
      - A failing task gets a fixer, then blocks after maxAttempts.
      - An injected attribution trailer never reaches main.
    tests: |
      test/e2e/m5-rebase.test.ts.
    acceptance: "pnpm exec vitest run --project e2e m5"

  # ───────────────────────────── Milestone 6: review notes, request changes, Try it ─────────────────────────────

  - id: m6-request-changes
    milestone: 6
    title: "review: line comments, findings, request changes and rounds"
    deps: [m5-verify]
    touches: [packages/core/src/review/, packages/web/src/screens/, prompts/refine.md]
    goal: |
      Implement PLAN.md section 10, items 7 and 8 of 15.2, the comments, findings and request-changes routes of 14.1,
      and request_changes in 6.3.
      - Comments CRUD, tagged with the round, and dismissing findings.
      - A pure message builder: the instruction, the selected comments (file, line, excerpt, text), the selected
        findings, and optionally the failing test output. The UI previews the exact text before sending.
      - Modes:
        - resume: `--resume <claude_session_id>` in the same worktree
        - fresh: a new worker reading the task, a diff summary and the notes, using prompts/refine.md
      - Rounds:
        - The round goes up by one and the task returns to `running`.
        - When the round ends, the checks run again, and the task goes back to review (or straight to rebasing, by
          the usual rules).
      - Changes since the previous round, in the API and as a toggle in Review.
      - UI:
        - Monaco view zones for comments and findings, with add-comment on a line selection.
        - A "Request changes · N comments" button.
        - The Request changes screen:
          - a back link and "this becomes round N+1"
          - "What to send" toggles, with findings off by default
          - the overall instruction and "Who does the work"
          - Send to session and Cancel
          - the Rounds history and a live preview of the message
      - The MCP tool request_changes, with its chat action line.
    tests: |
      - Unit: the message builder.
      - Integration: a round trip in resume mode and in fresh mode with fake-claude.
      - Playwright, test/e2e/web/request-changes.spec.ts: add a comment, request changes, see a new round, and
        return to review with the diff since the previous round.
    acceptance: "pnpm exec vitest run --project unit request-changes && pnpm exec vitest run --project integration rounds && pnpm exec playwright test request-changes"

  - id: m6-try-it
    milestone: 6
    title: "review: Try it yourself terminals"
    deps: [m6-request-changes]
    touches: [packages/core/src/terminals.ts, packages/web/src/components/]
    goal: |
      Implement "Try it yourself" from PLAN.md section 10, the pty kill of 3.3 step 1, the terminal routes of 14.1,
      and `terminal.output`.
      - node-pty is imported lazily.
      - One terminal per task, in the task's (rebased) worktree, with the cleaned env.
      - The terminal is registered for the kill path, which calls `pty.kill("SIGKILL")`.
      - Output streams over the WebSocket as terminal.output. Input goes over the WebSocket or a POST. There is a
        Stop button.
      - xterm sits in the right column of Test and decide.
      - If node-pty can't load, the feature shows a clear message and nothing else breaks.
    tests: |
      Integration:
      - `echo hi && pwd` in a task terminal streams its output, and the cwd is the worktree.
      - Stop kills the terminal.
      - The kill path kills open ptys.
    acceptance: "pnpm exec vitest run --project integration try-it"

  - id: m6-verify
    milestone: 6
    title: "test: milestone 6 verification"
    deps: [m6-try-it]
    touches: [test/e2e/]
    goal: |
      Prove the milestone 6 "Done when" against the built binary. Fix any defect found.
      - A request-changes round trip works from the UI (Playwright) and from the chat (a fake Conductor calling
        request_changes).
      - The diff can show changes since the previous round.
    tests: |
      test/e2e/web/m6.spec.ts and test/e2e/m6-rounds.test.ts.
    acceptance: "pnpm exec playwright test m6 && pnpm exec vitest run --project e2e m6"

  # ───────────────────────────── Milestone 7: tasks board, planning, import/export ─────────────────────────────

  - id: m7-tasks-board
    milestone: 7
    title: "web: Tasks board, task editing and dependency graph"
    deps: [m6-verify]
    touches: [packages/web/src/screens/, test/e2e/web/]
    goal: |
      Implement item 3 of PLAN.md 15.2 and the fields of 7.1.
      - A board with Remaining, Running, Rebasing and Done columns. Blocked sits under Rebasing, and unmet
        dependencies show as pills.
      - A side panel with goal, acceptance, Depends on (with statuses), Unblocks and Touches, and the actions Edit,
        Move to top and Hold/Release.
      - Create and edit forms validated with the shared zod schemas.
      - A Graph tab using React Flow with automatic layout (for example dagre or elkjs). Status is shown by word as
        well as colour.
    tests: |
      - Web project: assigning tasks to columns, and unmet dependencies.
      - Playwright, test/e2e/web/tasks.spec.ts:
        - Edit a task and move it to the top.
        - The graph shows a node for every task.
    acceptance: "pnpm exec vitest run --project web tasks && pnpm exec playwright test tasks"

  - id: m7-planning
    milestone: 7
    title: "core: planning through chat, plan lists and tasks.yaml import/export"
    deps: [m7-tasks-board]
    touches: [packages/core/src/conductor/, prompts/planner.md, packages/web/src/chat/]
    goal: |
      Implement the vision-to-task-graph flow of PLAN.md 6.1, propose_plan in 6.3, plans in 6.5, and import and
      export in 7.1, 14.1 and 14.3.
      - prompts/planner.md guides the Conductor when it plans: small tasks with acceptance commands, touches, deps
        and priorities.
      - propose_plan shows the plan message. Start, or "go ahead" in the chat, creates all the tasks atomically,
        validated as a DAG.
      - Import and export work everywhere: through the API, the CLI and the "Import tasks.yaml" starter.
        - Cycles and unknown deps are rejected with precise messages.
        - Unknown keys produce a warning.
    tests: |
      Integration:
      - Importing this repository's own tasks.yaml gives a valid graph with the right deps.
      - An export, then an import, round-trips.
      - A cycle is rejected with a message that names it.
      - A plan, then Start, creates the tasks.
    acceptance: "pnpm exec vitest run --project integration planning import"

  - id: m7-verify
    milestone: 7
    title: "test: milestone 7 verification"
    deps: [m7-planning]
    touches: [test/e2e/web/]
    goal: |
      Prove the milestone 7 "Done when": a vision shared in the chat becomes an imported, valid task graph. Use
      Playwright with a fake Conductor that calls propose_plan. Click Start, then check the tasks on the board and in
      the graph. Fix any defect found.
    tests: |
      test/e2e/web/m7.spec.ts.
    acceptance: "pnpm exec playwright test m7"

  # ───────────────────────────── Milestone 8: polish ─────────────────────────────

  - id: m8-settings-notify
    milestone: 8
    title: "web: Settings screen and desktop notifications"
    deps: [m7-verify]
    touches: [packages/web/src/screens/, packages/core/src/notify.ts]
    goal: |
      Implement item 9 of PLAN.md 15.2, decisions 3, 15 and 16, and gated set_config.
      - Settings is opened from `Running · Max` and saves to .mastermind/config.yaml. It covers:
        - models per role, and whether the reviewer runs
        - worker permissions (bypass, auto or allowlist) and the allowlist
        - the sandbox on or off, with allowed domains
        - the number of parallel workers
        - the build, test and setup commands
        - protected paths
      - The chat can change the same settings behind a confirmation.
      - Notifications go out for events that need the owner: blocked, sign-in needed, a protected task waiting for
        review, or a usage-limit pause.
        - With a browser tab connected: the browser Notification API, with permission asked once, and a click opens
          the right screen.
        - With no tab connected: `osascript` on macOS, `notify-send` on Linux.
        - There is a Settings toggle.
        - The notifier is injectable, and tests never fire real OS notifications.
    tests: |
      - Integration:
        - With no WebSocket client, a blocked task calls the native notifier once (captured by a fake).
        - With a client connected, the web app gets it instead.
      - Playwright, test/e2e/web/settings.spec.ts: changing the worker model in Settings persists to config.yaml.
    acceptance: "pnpm exec vitest run --project integration notify && pnpm exec playwright test settings"

  - id: m8-conductor-rollover
    milestone: 8
    title: "core: Conductor rollover, wakeOnEvents and sign-in expiry end to end"
    deps: [m8-settings-notify]
    touches: [packages/core/src/conductor/, packages/core/src/auth.ts, packages/cli/src/tui/]
    goal: |
      Implement the history rollover of PLAN.md 6.2, wakeOnEvents in 6.4, and 4.3.
      - Rollover: when the context (tokens from result events) passes a threshold, a judge summarises it and a new
        conductor_sessions row starts. The next turn begins from the summary plus the digest, and the chat looks
        continuous.
      - `conductor.wakeOnEvents` gives the Conductor a turn after those events.
      - Sign-in expiry:
        - Check every 15 minutes, and before any session starts if the last check is more than 5 minutes old.
        - On failure:
          - set authRequired and pause
          - requeue the tasks without counting attempts
          - in the terminal, show "Your Claude sign-in expired. Press Enter to sign in again."; the login hand-off
            temporarily leaves Ink's raw mode
          - show the web banner
        - After a good check, clear the flag and resume.
    tests: |
      Integration:
      - Rollover with fake token counts.
      - fake-claude flips to expired mid-run:
        - sessions are requeued without attempts
        - the scheduler pauses
        - the banner event fires
        - after a fake login, everything resumes
    acceptance: "pnpm exec vitest run --project integration rollover auth-expiry"

  - id: m8-stuck-sandbox
    milestone: 8
    title: "core: stuck-session checks and sandbox blocked-access offers"
    deps: [m8-conductor-rollover]
    touches: [packages/core/src/sessions/stuck.ts, packages/core/src/sandbox.ts]
    goal: |
      Implement decision 17 and the "Blocked access" part of decision 9.
      - Stuck check, after `stuckCheck.after` and then every `stuckCheck.every`:
        - First compute the plain-code signals: minutes since the last edit, commit or output; the same command
          failing repeatedly; the same file edited back and forth; one command running long with no output.
        - Send those signals and the last 50 event summaries to a judge (sonnet, json schema {stuck, reason,
          suggestion}).
        - Not stuck: record the note "checked at 61 min: still making progress".
        - Stuck:
          - kill the group and commit the work as WIP
          - start a fresh session whose prompt includes the task, the diff, and the reason and suggestion
          - count it as an attempt
          - post one chat line
      - Blocked access: when a task fails because of a blocked host, the chat offers it once per host, for example
        "<task> couldn't reach github.com. Allow it for this project?", with Allow and Not now (a proposal). Allow
        saves the host to config.
    tests: |
      - Unit: computing the stuck signals.
      - Integration with an injected clock:
        - A stuck verdict starts a fresh session whose prompt carries the reason and suggestion.
        - A not-stuck verdict records the note.
        - A blocked host is offered once.
    acceptance: "pnpm exec vitest run --project unit stuck && pnpm exec vitest run --project integration stuck sandbox"

  - id: m8-owner-branch
    milestone: 8
    title: "core: rebasing the owner's branch onto main"
    deps: [m8-stuck-sandbox]
    touches: [packages/core/src/rebase/, packages/web/src/]
    goal: |
      Implement decisions 14, 22 and 6.
      - The owner triggers it by saying "rebase my branch" in the chat (an MCP tool) or with a Rebase button.
        Choose where the button lives and record it.
      - The owner's checkout must be clean; otherwise mastermind asks them to commit first.
      - Rebase a detached copy of the branch onto main in a temporary worktree under the central folder, and run the
        same checks as for a task.
      - Conflicts go to a fixer. Its changes are folded into the owner's commit where the conflict happened, so no
        AI-written commit appears.
      - The owner's commits are kept unsquashed, with their own messages and authors.
      - Fast-forward main with update-ref, then move the owner's branch to the new main with `git reset --keep` in
        their checkout.
      - When main moves, the chat offers "main moved N commits; rebase <branch> onto it?". It acts only after the
        owner confirms and the checkout is clean.
      - If main has an upstream, the chat may say how many commits it is ahead. Never push or fetch.
    tests: |
      Integration:
      - The owner's two commits land on main unchanged (same messages and authors), with linear history.
      - A dirty checkout is refused.
      - A conflict fix is folded into the owner's commit, with no extra commit and no attribution.
    acceptance: "pnpm exec vitest run --project integration owner-branch"

  - id: m8-install
    milestone: 8
    title: "build: clean install, README, log retention and doctor completeness"
    deps: [m8-owner-branch]
    touches: [README.md, packages/cli/, packages/core/src/logs.ts, scripts/]
    goal: |
      Implement decision 10, log retention from PLAN.md 20, and the full doctor of 14.3.
      - `pnpm build && pnpm link --global` works from a clean clone, and the CLI's dist includes the web assets and
        prompts.
      - `pnpm smoke:install` is a script (scripts/smoke-install.sh) that:
        - clones the repo to a temp dir
        - installs and builds
        - links into a temp global prefix
        - runs `mastermind --version` and `mastermind doctor` with fake-claude on PATH
      - Logs older than the retention period (30 days by default, a config key) are pruned at startup.
      - doctor covers every check of 14.3, including worktree disk usage.
      - README.md:
        - what mastermind is
        - requirements: Node, pnpm, and a Claude Pro or Max subscription
        - install, run, and Ctrl+C twice
        - development: `pnpm verify`, and `pnpm test:live` as opt-in
        - a short architecture overview
    tests: |
      - Integration: log pruning with an injected clock.
      - The smoke:install script is the install test. Run it in this task, but keep it out of verify, since it
        clones and installs.
    acceptance: "pnpm smoke:install"

  - id: m8-final-audit
    milestone: 8
    title: "chore: final PLAN conformance audit, coverage floor and full verification"
    deps: [m8-install]
    touches: ["."]
    goal: |
      Close out the project.
      - Conformance: walk docs/PLAN.md section by section. Add a "Conformance" table to docs/implementation-notes.md
        (requirement, where it's implemented, which test proves it). Implement anything missing and fix anything
        wrong. Owner decisions (section 22) take precedence.
      - Code quality across the repo:
        - no `any`, unjustified casts, non-null assertions, TODOs or commented-out code
        - no unnecessary comments, dead code or duplicated logic
        - modules and names a human can easily read
      - Tests:
        - delete trivial or overlapping tests, and strengthen weak ones
        - check that failure paths are covered
        - remove flakiness: run `pnpm test` and `pnpm test:e2e` three times in a row, and all runs must pass
      - Coverage: add vitest coverage thresholds for packages/core at the level actually achieved, rounded down.
        Aim for at least 85% of lines through meaningful tests, never through trivial ones.
      - Run `pnpm verify` and `pnpm smoke:install` one last time.
    tests: |
      Whatever the audit shows is missing. Prefer extending existing scenario tests over adding new tiny ones.
    acceptance: "pnpm coverage && pnpm smoke:install"
